services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geodjango_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geodjango}
      POSTGRES_USER: ${POSTGRES_USER:-geodjango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geodjango}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geodjango}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geodjango_app
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geodjango}
      POSTGRES_USER: ${POSTGRES_USER:-geodjango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geodjango}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      db:
        condition: service_healthy
    # Garde le conteneur vivant pour pouvoir s'y attacher avec VS Code
    command: tail -f /dev/null

volumes:
  postgres_data: